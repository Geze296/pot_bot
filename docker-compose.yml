name: pot-bot

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: potbot
      POSTGRES_PASSWORD: potbot # local development only
      POSTGRES_DB: potbot
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potbot -d potbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
